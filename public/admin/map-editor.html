<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur de cartes — Kingdom Battleground</title>
<link rel="stylesheet" href="/admin/admin.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; min-height: 0; }
  #topbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #1f1408; border-bottom: 1px solid #5a3c10; flex-wrap: wrap; }
  #topbar .title { color: #c8960c; font-weight: bold; margin: 0 8px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  #topbar .title small { color: #a89060; font-weight: normal; }
  #topbar .sep { width: 1px; height: 22px; background: #5a3c10; margin: 0 4px; }
  #topbar .grow { flex: 1; }
  #dirty { color: #e0a040; font-size: 0.85em; }
  #adminState { font-size: 0.8em; color: #a89060; }
  #main { flex: 1; display: flex; min-height: 0; }
  #toolbar { width: 58px; background: #1a1008; border-right: 1px solid #5a3c10; display: flex; flex-direction: column; gap: 4px; padding: 6px 5px; }
  #toolbar button { width: 48px; height: 46px; padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 18px; line-height: 1; }
  #toolbar button small { font-size: 9px; margin-top: 3px; color: #a89060; }
  #toolbar button.on small { color: #1a1008; }
  #viewport { flex: 1; position: relative; min-width: 200px; overflow: hidden; background: #120b05; }
  #viewport canvas { display: block; touch-action: none; }
  #viewport.pan canvas { cursor: grab; }
  #viewport.panning canvas { cursor: grabbing; }
  #viewport.pick canvas { cursor: copy; }
  #help { position: absolute; left: 8px; top: 8px; max-width: 460px; background: rgba(20,12,4,0.82); border: 1px solid #5a3c10; border-radius: 5px; padding: 6px 9px; font-size: 0.78em; color: #d8c590; pointer-events: none; }
  #preview { width: 42%; min-width: 320px; border-left: 2px solid #5a3c10; display: flex; flex-direction: column; background: #0c0804; }
  #preview[hidden] { display: none; }
  #preview .bar { display: flex; gap: 6px; align-items: center; padding: 5px 8px; background: #1f1408; border-bottom: 1px solid #5a3c10; font-size: 0.85em; }
  #preview iframe { flex: 1; border: 0; width: 100%; background: #000; }
  #side { width: 320px; background: #1a1008; border-left: 1px solid #5a3c10; display: flex; flex-direction: column; min-height: 0; }
  #tabs { display: flex; border-bottom: 1px solid #5a3c10; }
  #tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 8px 4px; font-size: 0.85em; }
  #tabs button.on { background: #2c1d0a; color: #f0c040; box-shadow: inset 0 -2px #c8960c; }
  #tabs .badge { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; font-size: 0.8em; margin-left: 3px; background: #5a3c10; color: #fff; }
  #tabs .badge.err { background: #a02020; }
  #tabs .badge.warn { background: #8b5e0a; }
  #panel { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #status { display: flex; gap: 14px; padding: 4px 10px; background: #1f1408; border-top: 1px solid #5a3c10; font-size: 0.8em; color: #c8b07a; white-space: nowrap; overflow: hidden; }
  #status .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .vitem { display: block; width: 100%; text-align: left; font-size: 0.8em; padding: 3px 6px; margin: 1px 0; background: transparent; border: 1px solid transparent; }
  .vitem:hover { border-color: #5a3c10; background: #2c1d0a; }
  .vgroup { border: 1px solid #3a2810; border-radius: 4px; padding: 6px; }
  .vgroup.err { border-color: #7a2020; }
  .vgroup header { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 0.85em; margin-bottom: 4px; }
  .vgroup.err header b { color: #ff7060; }
  .vgroup.warn header b { color: #f0b040; }
  .vlist { max-height: 180px; overflow-y: auto; }
  table.stats { width: 100%; font-size: 0.82em; border-collapse: collapse; }
  table.stats td { padding: 2px 4px; border-bottom: 1px solid #2a1a06; }
  table.stats td:last-child { text-align: right; color: #f0c040; }
  .hist { display: flex; align-items: flex-end; gap: 2px; height: 60px; }
  .hist div { flex: 1; background: #8b5e0a; min-height: 1px; position: relative; }
  .hist div span { position: absolute; bottom: -14px; left: 0; right: 0; text-align: center; font-size: 9px; color: #a89060; }
</style>
</head>
<body>
<header id="topbar">
  <a class="btn small" href="/admin/" title="Tableau de bord admin">← Admin</a>
  <span class="title" id="mapTitle">…</span>
  <span id="dirty"></span>
  <span class="sep"></span>
  <button type="button" id="btnNew" title="Nouvelle carte">Nouveau</button>
  <select id="openSelect" title="Ouvrir une carte"><option value="">Ouvrir…</option></select>
  <button type="button" id="btnImport" title="Importer un fichier JSON">Importer</button>
  <button type="button" id="btnExport" title="Exporter en fichier JSON">Exporter</button>
  <span class="sep"></span>
  <button type="button" id="btnUndo" title="Annuler (Ctrl+Z)">↶</button>
  <button type="button" id="btnRedo" title="Rétablir (Ctrl+Maj+Z / Ctrl+Y)">↷</button>
  <button type="button" id="btnFit" title="Recadrer (F)">⤢</button>
  <span class="sep"></span>
  <button type="button" id="btnSave" class="primary" title="Enregistrer (Ctrl+S)">Enregistrer</button>
  <button type="button" id="btnSaveAs" title="Enregistrer sous… (Ctrl+Maj+S)">Enregistrer sous…</button>
  <span class="sep"></span>
  <button type="button" id="btnPreview" title="Aperçu 3D (P)">Aperçu 3D</button>
  <span class="grow"></span>
  <span id="adminState"></span>
  <button type="button" id="btnHelp" title="Raccourcis (?)">?</button>
</header>
<div id="main">
  <nav id="toolbar"></nav>
  <section id="viewport">
    <canvas id="map"></canvas>
    <div id="help"></div>
  </section>
  <aside id="preview" hidden>
    <div class="bar">
      <b>Aperçu 3D</b>
      <select id="previewMode">
        <option value="draft">Brouillon (état actuel)</option>
        <option value="saved">Version enregistrée</option>
      </select>
      <button type="button" id="previewReload" title="Recharger l'aperçu">↻ Actualiser</button>
      <a id="previewOpen" class="btn small" target="_blank" href="#">Ouvrir ↗</a>
      <span class="grow" style="flex:1"></span>
      <button type="button" id="previewClose" title="Fermer">×</button>
    </div>
    <iframe id="previewFrame" title="Aperçu 3D"></iframe>
  </aside>
  <aside id="side">
    <div id="tabs">
      <button type="button" data-tab="tool" class="on">Outil</button>
      <button type="button" data-tab="map">Carte</button>
      <button type="button" data-tab="valid">Validation <span class="badge" id="vbadge">0</span></button>
      <button type="button" data-tab="stats">Stats</button>
    </div>
    <div id="panel"></div>
  </aside>
</div>
<footer id="status">
  <span class="grow" id="hoverInfo">—</span>
  <span id="perfInfo"></span>
  <span id="zoomInfo"></span>
</footer>
<script type="module" src="/js/editor/main.js"></script>
</body>
</html>
