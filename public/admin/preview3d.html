<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<base href="/">
<title>Aperçu 3D — brouillon</title>
<link rel="stylesheet" href="/admin/admin.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--a-bg2); color: var(--a-text); font-family: var(--a-body); }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--a-bg2); z-index: 2; transition: opacity 0.3s; }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .bar { width: 240px; height: 6px; background: var(--a-raised); border-radius: 3px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--a-red); transition: width 0.2s; }
  #hint { position: fixed; left: 8px; bottom: 6px; font-size: 11px; color: var(--a-soft); background: rgba(0,0,0,0.5); padding: 3px 7px; border-radius: 4px; pointer-events: none; }
  #err { color: var(--a-red-text); max-width: 80%; text-align: center; }
</style>
</head>
<body>
<div id="loading"><div class="bar"><div id="loadBar"></div></div><p id="loadText">Préparation de l'aperçu…</p><p id="err"></p></div>
<div id="hint">Brouillon non enregistré · gauche : orbite · droit : déplacer · molette : zoom · G : grille</div>
<canvas id="canvas3d" tabindex="0"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>
<script type="module">
import { createWorld } from '/js/map3d/world.js';

const loadBar = document.getElementById('loadBar');
const loadText = document.getElementById('loadText');
let doc = null;
try { doc = window.parent !== window && window.parent.__kbEditorPreview ? window.parent.__kbEditorPreview() : null; } catch (e) { /* cross-origin */ }
const params = new URLSearchParams(location.search);
try {
  const world = await createWorld({
    canvas: document.getElementById('canvas3d'),
    container: document.body,
    persistKey: 'mapEditorPreview',
    map: doc || undefined,
    mapId: params.get('map') || 'default',
    intro: false,
    onProgress: (pct, text) => { loadBar.style.width = pct + '%'; if (text) loadText.textContent = text; },
  });
  world.start();
  setTimeout(() => document.getElementById('loading').classList.add('hidden'), 150);
  window.addEventListener('resize', () => world.resize());
  window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'g') world.setGrid(world.grid > 0 ? 0 : 0.11); });
  window.__map3d = world;
} catch (e) {
  document.getElementById('err').textContent = 'Erreur de l\'aperçu 3D : ' + e.message;
  console.error(e);
}
</script>
</body>
</html>
