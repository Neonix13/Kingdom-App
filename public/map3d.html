<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingdom Battleground — 3D Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0b0d10; font-family: 'Segoe UI', system-ui, sans-serif; }
  #canvas3d { display: block; width: 100vw; height: 100vh; outline: none; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #1b1a16 0%, #0a0a0c 70%);
    color: #d9bf78; z-index: 100; transition: opacity 1.2s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading h1 { font-size: 30px; font-weight: 300; margin-bottom: 22px; letter-spacing: 9px; }
  #loading .bar { width: 320px; height: 2px; background: rgba(217,191,120,0.15); }
  #loading .bar-fill { height: 100%; background: linear-gradient(90deg, #8a7440, #f2d68e); transition: width 0.25s; }
  #loading p { margin-top: 12px; font-size: 12px; letter-spacing: 2px; opacity: 0.55; }
  #hud {
    position: fixed; top: 16px; left: 16px; color: #e3cf96;
    font-size: 12px; background: rgba(12,12,16,0.55); padding: 12px 16px;
    border-radius: 10px; border: 1px solid rgba(217,191,120,0.18);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    line-height: 1.7; user-select: none; transition: opacity 0.4s;
  }
  #hud .title { font-size: 13px; letter-spacing: 3px; font-weight: 600; margin-bottom: 4px; }
  #hud .stats { color: #bfb08a; font-variant-numeric: tabular-nums; }
  #hud .keys { margin-top: 6px; color: #8e8670; font-size: 11px; }
  #hud .keys b { color: #d9bf78; font-weight: 600; }
  #hud label { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: #bfb08a; }
  #hud input[type=range] { width: 140px; accent-color: #d9bf78; }
  #controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    color: #9a927c; font-size: 11px; background: rgba(12,12,16,0.45);
    padding: 7px 16px; border-radius: 999px; pointer-events: none; letter-spacing: 0.5px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity 0.4s;
  }
  body.clean #hud, body.clean #controls { opacity: 0; pointer-events: none; }
</style>
<link rel="stylesheet" href="/css/ink-d.css">
<style>
  #hud { font-family: var(--ink-body); background: rgba(14,13,12,.86); border: 0; border-top: 2px solid var(--ink-red); border-radius: 0; color: var(--ink-text); backdrop-filter: none; }
  #hud .title { font: 400 14px var(--ink-display); letter-spacing: 3px; color: var(--ink-text); }
  #hud .stats, #hud .sel, #hud label { color: var(--ink-soft); }
  #hud .keys { color: var(--ink-muted); }
  #hud .keys b { color: var(--ink-red-text); }
  #hud input[type=range] { accent-color: var(--ink-red); }
  #loading { font-family: var(--ink-display); color: var(--ink-text); background: var(--ink-bg); }
</style>
</head>
<body>

<div id="loading">
  <h1>KINGDOM BATTLEGROUND</h1>
  <div class="bar"><div class="bar-fill" id="loadBar" style="width:0%"></div></div>
  <p id="loadText">Loading map data...</p>
</div>

<div id="hud">
  <div class="title">KINGDOM · 3D MAP</div>
  <div class="stats" id="stats"></div>
  <label>Time of day <input type="range" id="tod" min="5.5" max="20.5" step="0.05" value="16.2"></label>
  <div class="keys"><b>G</b> grid · <b>C</b> cinematic · <b>Q</b> quality · <b>H</b> hide UI · <b>R</b> reset</div>
</div>
<div id="controls">Left drag: orbit &nbsp;·&nbsp; Right drag: pan &nbsp;·&nbsp; Scroll: zoom</div>

<canvas id="canvas3d" tabindex="0"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import { createWorld } from './js/map3d/world.js';

const params = new URLSearchParams(location.search);
const loadBar = document.getElementById('loadBar');
const loadText = document.getElementById('loadText');
const canvas = document.getElementById('canvas3d');

const world = await createWorld({
  canvas,
  container: document.body,
  persistKey: 'map3d',
  mapId: params.get('map') || 'default',
  intro: !params.has('nointro'),
  quality: params.has('q') ? parseInt(params.get('q'), 10) || 0 : null,
  onProgress: (pct, text) => {
    loadBar.style.width = pct + '%';
    if (text) loadText.textContent = text;
  },
});
world.start();
setTimeout(() => document.getElementById('loading').classList.add('hidden'), 150);

const todInput = document.getElementById('tod');
todInput.value = world.hour;
todInput.addEventListener('input', () => world.previewTimeOfDay(parseFloat(todInput.value)));
todInput.addEventListener('change', () => { world.commitTimeOfDay(parseFloat(todInput.value)); todInput.blur(); });

const statsEl = document.getElementById('stats');
const hexCount = world.allHexes.size, forestCount = (world.hexesByType.forest || []).length;
function updateHud() {
  const g = world.governor, ms = g.avgMs;
  const perfTxt = ms > 0 ? `${(1000 / ms).toFixed(0)} fps · ${ms.toFixed(1)} ms` : 'measuring…';
  statsEl.innerHTML = `${hexCount.toLocaleString()} hexes · ${forestCount} forests<br>`
    + `${perfTxt} · ${world.LEVELS[g.level].name}${g.locked ? ' (locked)' : ' (auto)'}`;
}
setInterval(updateHud, 500);
updateHud();

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  const k = e.key.toLowerCase();
  const g = world.governor;
  if (k === 'r') world.flyTo(new world.THREE.Vector3(world.DEFAULT_VIEW.px, world.DEFAULT_VIEW.py, world.DEFAULT_VIEW.pz), new world.THREE.Vector3(world.DEFAULT_VIEW.tx, world.DEFAULT_VIEW.ty, world.DEFAULT_VIEW.tz), 1.2);
  else if (k === 'g') world.setGrid(world.grid > 0 ? 0 : 0.11);
  else if (k === 'c') world.controls.autoRotate = !world.controls.autoRotate;
  else if (k === 'h') document.body.classList.toggle('clean');
  else if (k === 'q') {
    if (g.locked && g.level === world.LEVELS.length - 1) { g.locked = false; g.set(0); }
    else { g.locked = true; g.set(g.level + 1); }
    updateHud();
  }
});
window.addEventListener('resize', () => world.resize());
window.__map3d = world;
</script>
</body>
</html>
