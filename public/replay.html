<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kingdom Battleground — Replay</title>
  <link rel="stylesheet" href="/css/ink-d.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--ink-bg); color: var(--ink-text); font-family: var(--ink-body); overflow: hidden; }
    #top-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 100;
      background: #0E0D0C; box-shadow: 0 2px 0 var(--ink-red), 0 8px 24px rgba(0,0,0,.5);
      display: flex; align-items: center; padding: 0 18px; gap: 16px;
    }
    #top-bar .seal { width: 34px; height: 34px; border-radius: 50%; background: var(--ink-red); color: var(--ink-bg); font: 20px var(--ink-brush); display: inline-flex; align-items: center; justify-content: center; flex: none; }
    #top-bar h1 { font: 400 20px var(--ink-display); letter-spacing: 3px; color: var(--ink-text); white-space: nowrap; }
    #top-bar .info { font-size: 12px; color: var(--ink-muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #top-bar .info strong { color: var(--ink-text); }
    #top-bar .info .ink-ic { width: 15px; height: 15px; }
    #top-bar a.pill { margin-left: auto; color: var(--ink-text); font: 700 12px var(--ink-body); text-decoration: none; border: 1px solid var(--ink-line-strong); border-radius: 999px; padding: 7px 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    #top-bar a.pill:hover { border-color: var(--ink-red); color: var(--ink-red-text); }
    #top-bar a.pill + a.pill { margin-left: 0; }
    #controls {
      position: fixed; bottom: 0; left: 0; right: 0; height: 104px; z-index: 100;
      background: #0E0D0C; border-top: 1px solid var(--ink-line);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 0 20px;
    }
    #controls .row { display: flex; align-items: center; gap: 8px; }
    #controls .row .sp { width: 14px; }
    #frame-info { font: 700 12px var(--ink-body); color: var(--ink-muted); min-width: 220px; text-align: center; }
    #frame-info b { font: 400 15px var(--ink-display); color: var(--ink-text); }
    #controls label { font: 700 11px var(--ink-body); color: var(--ink-muted); letter-spacing: 1px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
    #controls .ink-track { width: min(900px, 86%); }
    #canvas-container { position: fixed; top: 56px; left: 0; right: 0; bottom: 104px; }
    canvas { display: block; width: 100%; height: 100%; }
    #sidebar {
      position: fixed; top: 56px; right: 0; width: 290px; bottom: 104px; z-index: 50;
      background: var(--ink-panel); border-left: 1px solid var(--ink-line); overflow-y: auto;
      padding: 12px 14px; font-size: 12px;
    }
    #sidebar h3 { font: 900 16px var(--ink-mincho); color: var(--ink-text); margin: 12px 0 6px; display: flex; align-items: center; gap: 8px; }
    #sidebar h3::before { content: ''; width: 14px; height: 3px; background: var(--ink-red); }
    .unit-card {
      background: rgba(255,255,255,.03); border-left: 3px solid var(--ink-line-strong);
      padding: 5px 8px; margin: 3px 0; display: flex; align-items: center; gap: 8px;
    }
    .unit-card .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
    .unit-card .name { flex: 1; color: var(--ink-text); font-weight: 700; font-size: 11.5px; }
    .unit-card .hp { font-size: 10.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
    .unit-card.dead { opacity: 0.35; }
    .unit-card.general { border-left-color: var(--ink-red); }
    .action-log { font-size: 11.5px; color: var(--ink-soft); padding: 4px 0; border-bottom: 1px solid var(--ink-line); line-height: 1.45; }
    .action-log .action-type { font-weight: 900; color: var(--ink-red-text); text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
    .action-log .ink-ic { width: 13px; height: 13px; vertical-align: -2px; color: var(--ink-red-text); }
    #drop-zone {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200;
      background: radial-gradient(ellipse at 50% 40%, #1d1b18 0%, #0a0a0c 70%); display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; text-align: center; padding: 20px;
    }
    #drop-zone.hidden { display: none; }
    #drop-zone .seal { width: 72px; height: 72px; border-radius: 50%; background: var(--ink-red); color: var(--ink-bg); font: 42px var(--ink-brush); display: flex; align-items: center; justify-content: center; }
    #drop-zone h2 { font: 400 26px var(--ink-display); letter-spacing: 3px; color: var(--ink-text); }
    #drop-zone p { color: var(--ink-muted); font-size: 14px; }
    #drop-zone label {
      background: var(--ink-red); color: #fff; padding: 12px 28px; border-radius: 999px;
      cursor: pointer; font: 700 14px var(--ink-body);
    }
    #drop-zone label:hover { background: var(--ink-red-hi); }
    #drop-zone input { display: none; }
    #load-error { color: var(--ink-red-text); }
    @media (max-width: 760px) { #sidebar { display: none; } #canvas-container { right: 0; } #top-bar .info { display: none; } #frame-info { min-width: 0; } }
  </style>
</head>
<body>
  <div id="top-bar">
    <span class="seal">録</span>
    <h1>REPLAY</h1>
    <span class="info" id="time-info"></span>
    <span class="info" id="matchup-info"></span>
    <span class="info" id="result-info"></span>
    <a id="link-3d" class="pill" href="#"><svg class="ink-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Voir en 3D</a>
    <a class="pill" href="/">Menu</a>
  </div>
  <script>
    (function () {
      const p = new URLSearchParams(location.search);
      document.getElementById('link-3d').href = '/replay3d.html' + (p.get('file') ? '?file=' + encodeURIComponent(p.get('file')) : '?local=1');
    })();
  </script>

  <div id="canvas-container">
    <canvas id="replay-canvas"></canvas>
  </div>

  <div id="sidebar">
    <h3>Actions</h3>
    <div id="action-list"></div>
    <div id="scores-panel"></div>
    <div id="players-units"></div>
  </div>

  <div id="controls">
    <div class="row">
      <button id="btn-start" class="ink-btn" title="Début (Début)" aria-label="Début"><svg class="ink-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 6l-9 6 9 6z"/></svg></button>
      <button id="btn-prev" class="ink-btn" title="Étape précédente" aria-label="Étape précédente"><svg class="ink-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6l-8 6 8 6zM20 6l-8 6 8 6z"/></svg></button>
      <button id="btn-step-prev" class="ink-btn" title="Action précédente" aria-label="Action précédente"><svg class="ink-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button id="btn-play" class="ink-btn big" title="Lecture / pause (Espace)" aria-label="Lecture"><svg class="ink-ic fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg></button>
      <button id="btn-step-next" class="ink-btn" title="Action suivante" aria-label="Action suivante"><svg class="ink-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button id="btn-next" class="ink-btn" title="Étape suivante" aria-label="Étape suivante"><svg class="ink-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6l8 6-8 6zM4 6l8 6-8 6z"/></svg></button>
      <button id="btn-end" class="ink-btn" title="Fin" aria-label="Fin"><svg class="ink-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6l9 6-9 6z"/></svg></button>
      <span class="sp"></span>
      <span id="frame-info">Image 0 / 0</span>
      <label>Vitesse
        <select id="speed-select" class="ink-select">
          <option value="2000">0.5x</option>
          <option value="1000">1x</option>
          <option value="500" selected>2x</option>
          <option value="200">5x</option>
          <option value="50">20x</option>
        </select>
      </label>
    </div>
    <div class="ink-track"><div class="ink-ticks" id="ticks"></div><input type="range" id="timeline" min="0" max="0" value="0" aria-label="Chronologie"></div>
  </div>

  <div id="drop-zone">
    <div class="seal">録</div>
    <h2>CHARGER UN REPLAY</h2>
    <p>Déposez un fichier JSON de replay ici ou choisissez-le</p>
    <label>Choisir un fichier <input type="file" id="file-input" accept=".json"></label>
    <p id="load-error"></p>
  </div>

  <script src="/js/hexGrid.js"></script>
  <script>
    // === STATE ===
    let replay = null;
    let currentFrame = 0;
    let playing = false;
    let playInterval = null;
    let camX = 0, camY = 0, zoom = 0.45;
    let isDragging = false, dragStartX = 0, dragStartY = 0, camAtDragX = 0, camAtDragY = 0;
    let terrainData = {}, segmentData = {}, mapHexKeys = [], mapBg = null, mapObjectives = [];
    let loadedMapId = null;

    const canvas = document.getElementById('replay-canvas');
    const ctx = canvas.getContext('2d');
    const mapImage = new Image();
    mapImage.onload = () => render();

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Map of the battle: registry /api/maps/<id>, fallback to the legacy /data/*.json files for 'default'
    async function fetchMapDoc(id) {
      try {
        const res = await fetch(`/api/maps/${encodeURIComponent(id)}`);
        if (res.ok) return await res.json();
      } catch (e) { /* static hosting */ }
      if (id !== 'default') throw new Error('Carte introuvable : ' + id);
      const [terrain, segments, height] = await Promise.all(['terrain', 'segments', 'height'].map(n => fetch(`/data/${n}.json`).then(r => r.json())));
      return { id: 'default', terrain, segments, height, objectives: [], background: { image: '/assets/img/map.webp', hexSize: MAP_HEX_SIZE, origX: MAP_ORIG_X, origY: MAP_ORIG_Y, width: MAP_IMG_W, height: MAP_IMG_H } };
    }

    async function loadMap(id) {
      id = id || 'default';
      if (loadedMapId === id) return;
      loadedMapId = id;
      try {
        const doc = await fetchMapDoc(id);
        mapHexKeys = Object.keys(doc.height || doc.terrain || {});
        terrainData = {};
        for (const k of mapHexKeys) terrainData[k] = (doc.terrain || {})[k] || 'plain';
        for (const [k, t] of Object.entries(doc.terrain || {})) terrainData[k] = t;
        segmentData = doc.segments || {};
        mapObjectives = (doc.objectives || []).map(o => ({ ...o, id: o.id || `${o.q},${o.r}` }));
        mapBg = doc.background && doc.background.image ? doc.background : null;
        if (mapBg) mapImage.src = mapBg.image;
      } catch (e) {
        console.error(e);
      }
      render();
    }

    const TERRAIN_COLORS = {
      forest: 'rgba(30,100,20,0.5)', river: 'rgba(40,120,220,0.5)',
      building: 'rgba(140,100,60,0.5)', road: 'rgba(200,170,100,0.3)',
      bridge: 'rgba(220,140,30,0.5)',
    };
    const SEGMENT_COLORS = {
      river:'#4a90d9', cliff:'#8888aa', bridge:'#e8a040', passerelle:'#c8b060',
      barriere:'#4a8040', chevaux_de_frise:'#c04040', mur:'#606060', echelle:'#a07840', escalier:'#c8b898', rampe:'#b8a070',
    };
    const SEGMENT_EDGE_DIRS = [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
    const PLAYER_COLORS = { p1: '#4a90d9', p2: '#d94a4a' };
    const STANCE_NAMES = { marche: 'Marche', combat: 'Combat', charge: 'Charge', defense_combat: 'Déf. combat', defense_distance: 'Déf. distance', repos: 'Repos' };
    const END_REASONS = { elimination: 'général tué', points: 'points de victoire', max_turns: 'limite de tours' };
    // === FILE LOADING ===
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    document.addEventListener('dragover', e => { e.preventDefault(); });
    document.addEventListener('drop', e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) loadFile(file);
    });
    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) loadFile(e.target.files[0]);
    });

    // Also support loading via URL param
    const urlParams = new URLSearchParams(window.location.search);
    const replayPath = urlParams.get('file');
    if (replayPath) {
      fetch(replayPath).then(r => r.json()).then(data => { initReplay(data); }).catch(e => showLoadError('Impossible de charger le replay : ' + e.message));
    } else if (urlParams.get('local')) {
      try {
        const raw = localStorage.getItem('kb_last_replay');
        if (raw) initReplay(JSON.parse(raw));
        else showLoadError('Aucun replay enregistré dans ce navigateur.');
      } catch (e) { showLoadError('Replay local illisible : ' + e.message); }
    } else {
      loadMap('default');
    }

    function showLoadError(msg) {
      document.getElementById('load-error').textContent = msg;
    }

    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          initReplay(data);
        } catch (err) { showLoadError('Replay JSON invalide : ' + err.message); }
      };
      reader.readAsText(file);
    }

    // ---- server replays (format kb-replay-1, see game/replay.js) -> frames { type, turn, manche, currentPlayerId, units, action, ... }
    function convertServerReplay(rep) {
      const roster = new Map((rep.roster || []).map(u => [u.id, u]));
      const fromTuple = ([id, q, r, vitality, morale, facing, stance, flags]) => {
        const base = roster.get(id) || { id, name: '?', maxVitality: vitality || 1 };
        return { ...base, id, q, r, vitality, morale, facing, stance, isFleeing: !!(flags & 1) };
      };
      const keyframes = (rep.keyframes || []).slice().sort((a, b) => a.e - b.e);
      const events = rep.events || [];
      const frames = [];
      let units = [];
      let owners = {};
      let scores = {};
      let winner = null, reason = null;
      let ctxState = { turn: 1, manche: 1, currentPlayerId: null, timeOfDay: null, isNight: false };
      const snapshot = (type, extra = {}) => frames.push({
        type, ...ctxState, units: units.map(u => ({ ...u })), owners: { ...owners }, scores: { ...scores }, winner, reason, ...extra,
      });
      const find = (id) => units.find(u => u.id === id);
      const nameOf = (id) => (find(id) || roster.get(id) || {}).name || '?';
      let k = 0;
      for (let i = 0; i <= events.length; i++) {
        while (k < keyframes.length && keyframes[k].e <= i) {
          const kf = keyframes[k];
          units = (kf.units || []).map(fromTuple);
          ctxState = { turn: kf.turn, manche: kf.manche, currentPlayerId: kf.currentPlayerId, timeOfDay: kf.timeOfDay, isNight: !!kf.isNight };
          snapshot(k === 0 ? 'battle_start' : 'end_turn');
          k++;
        }
        if (i === events.length) break;
        const ev = events[i];
        ctxState = { ...ctxState, turn: ev.turn ?? ctxState.turn, manche: ev.manche ?? ctxState.manche };
        let action = null;
        if (ev.k === 'move') {
          const u = find(ev.u);
          const path = ev.path || [];
          if (u && path.length) {
            const last = path[path.length - 1];
            if (path.length > 1) u.facing = hexFacingClient(path[path.length - 2][0], path[path.length - 2][1], last[0], last[1]);
            u.q = last[0]; u.r = last[1];
          }
          action = { type: 'move', unitId: ev.u, unitName: nameOf(ev.u), toQ: path.length ? path[path.length - 1][0] : null, toR: path.length ? path[path.length - 1][1] : null, path, ambush: ev.ambush ? nameOf(ev.ambush) : null };
        } else if (ev.k === 'combat') {
          const log = ev.log || {};
          const a = find(log.attackerId), t = find(log.targetId);
          if (t && log.targetVitalityLeft != null) t.vitality = log.targetVitalityLeft;
          if (t && log.targetMoraleLeft != null) t.morale = log.targetMoraleLeft;
          if (a && log.attackerVitalityLeft != null) a.vitality = log.attackerVitalityLeft;
          if (log.targetKilled) units = units.filter(u => u.id !== log.targetId);
          if (log.attackerKilled) units = units.filter(u => u.id !== log.attackerId);
          action = { type: log.duel ? 'duel' : 'attack', unitName: log.attackerName, targetName: log.targetName, combatLog: log };
        } else if (ev.k === 'stance') {
          const u = find(ev.u); if (u) u.stance = ev.s;
          action = { type: 'stance', unitName: nameOf(ev.u), to: ev.s };
        } else if (ev.k === 'facing') {
          const u = find(ev.u); if (u) u.facing = ev.f;
          action = { type: 'facing', unitName: nameOf(ev.u) };
        } else if (ev.k === 'motivate') {
          action = { type: 'motivate', unitName: nameOf(ev.u), success: ev.success, count: ev.count };
        } else if (ev.k === 'ability') {
          action = { type: 'ability', unitName: nameOf(ev.u), name: ev.name, effects: ev.effects || [] };
        } else if (ev.k === 'fled') {
          const names = (ev.units || []).map(nameOf);
          units = units.filter(u => !(ev.units || []).includes(u.id));
          action = { type: 'fled', names };
        } else if (ev.k === 'capture') {
          owners[ev.id] = ev.owner;
          const o = mapObjectives.find(x => x.id === ev.id);
          action = { type: 'capture', id: ev.id, name: o ? o.name : ev.id, owner: ev.owner };
        } else if (ev.k === 'score') {
          scores = { ...(ev.scores || {}) };
          action = { type: 'score', scores };
        } else if (ev.k === 'turn') {
          ctxState = { ...ctxState, currentPlayerId: ev.currentPlayerId ?? ctxState.currentPlayerId, timeOfDay: ev.timeOfDay ?? ctxState.timeOfDay, isNight: ev.isNight ?? ctxState.isNight };
        } else if (ev.k === 'end') {
          winner = ev.winnerId ?? null; reason = ev.reason || null;
          action = { type: 'end', winnerId: winner, reason };
        }
        if (action) snapshot('action', { action });
      }
      if (frames.length && (winner !== null || reason)) {
        const last = frames[frames.length - 1];
        last.winner = winner; last.reason = reason; last.phase = 'ended';
      }
      return {
        format: rep.format, mapId: rep.mapId, players: rep.players || [], settings: rep.settings || {},
        winner, reason, isDraw: !!reason && winner === null, truncated: !!rep.truncated, frames,
      };
    }

    async function initReplay(data) {
      if (data && data.format === 'kb-replay-1') {
        loadedMapId = null;
        await loadMap(data.mapId || 'default');
        data = convertServerReplay(data);
      } else {
        await loadMap('default');
      }
      if (!data || !Array.isArray(data.frames) || !data.frames.length) { showLoadError('Replay vide ou format inconnu.'); return; }
      replay = data;
      currentFrame = 0;
      dropZone.classList.add('hidden');

      // Update UI
      const players = replay.players || [];
      for (const p of players) PLAYER_COLORS[p.id] = p.color || PLAYER_COLORS[p.id] || '#888';
      document.getElementById('matchup-info').innerHTML = players
        .map(p => `<strong style="color:${escapeHtml(PLAYER_COLORS[p.id])}">${escapeHtml(p.name)}</strong> (${escapeHtml(p.generalId)})`).join(' contre ')
        + (replay.budget ? ` — Budget : ${replay.budget}` : '');
      const winnerP = players.find(p => p.id === replay.winner);
      document.getElementById('result-info').innerHTML = replay.isDraw || (!winnerP && replay.reason)
        ? '<strong>MATCH NUL</strong>'
        : winnerP ? `Vainqueur : <strong style="color:var(--ink-red-text);">${escapeHtml(winnerP.name)}</strong>${replay.reason ? ` (${END_REASONS[replay.reason] || replay.reason})` : ''}${replay.truncated ? ' — replay tronqué' : ''}` : '';

      const timeline = document.getElementById('timeline');
      timeline.max = replay.frames.length - 1;
      timeline.value = 0;

      buildTurnIndex();
      renderTicks();

      // Center camera on first units
      centerCameraOnUnits(replay.frames[0].units);
      render();
      updateSidebar();
      updateFrameInfo();
    }

    function centerCameraOnUnits(units) {
      if (!units || units.length === 0) return;
      let sumX = 0, sumY = 0, count = 0;
      for (const u of units) {
        if (u.q === null) continue;
        const { x, y } = hexToPixel(u.q, u.r);
        sumX += x; sumY += y; count++;
      }
      if (count === 0) return;
      camX = -(sumX / count) * zoom;
      camY = -(sumY / count) * zoom;
    }

    // === CONTROLS ===
    // Build turn index: list of frame indices that are end_turn or key boundaries
    let turnFrames = []; // indices of end_turn frames (player turn boundaries)

    function buildTurnIndex() {
      turnFrames = [0]; // always include frame 0 (deployment)
      if (!replay) return;
      for (let i = 0; i < replay.frames.length; i++) {
        if (replay.frames[i].type === 'end_turn' || replay.frames[i].type === 'battle_start') {
          turnFrames.push(i);
        }
      }
      // Include last frame
      const last = replay.frames.length - 1;
      if (turnFrames[turnFrames.length - 1] !== last) turnFrames.push(last);
    }

    function renderTicks() {
      const el = document.getElementById('ticks');
      el.innerHTML = '';
      if (!replay || replay.frames.length < 2) return;
      const n = replay.frames.length - 1;
      let lastTurn = null, lastNight = null, labelled = -1;
      for (let i = 0; i <= n; i++) {
        const f = replay.frames[i];
        const night = !!f.isNight;
        if (f.turn != null && f.turn !== lastTurn) {
          const pct = (i / n) * 100;
          const tick = document.createElement('i');
          tick.style.left = pct + '%';
          if (lastNight !== null && night !== lastNight) tick.className = 'day';
          el.append(tick);
          if (pct - labelled >= 6) {
            const b = document.createElement('b');
            b.style.left = pct + '%';
            b.textContent = f.turn;
            el.append(b);
            labelled = pct;
          }
          lastTurn = f.turn;
        }
        lastNight = night;
      }
    }

    function nextTurnFrame(from) {
      for (const idx of turnFrames) {
        if (idx > from) return idx;
      }
      return replay ? replay.frames.length - 1 : 0;
    }

    function prevTurnFrame(from) {
      for (let i = turnFrames.length - 1; i >= 0; i--) {
        if (turnFrames[i] < from) return turnFrames[i];
      }
      return 0;
    }

    document.getElementById('btn-start').onclick = () => { goToFrame(0); };
    document.getElementById('btn-prev').onclick = () => { goToFrame(prevTurnFrame(currentFrame)); };
    document.getElementById('btn-next').onclick = () => { goToFrame(nextTurnFrame(currentFrame)); };
    document.getElementById('btn-end').onclick = () => { goToFrame(replay ? replay.frames.length - 1 : 0); };
    document.getElementById('btn-step-prev').onclick = () => { goToFrame(currentFrame - 1); };
    document.getElementById('btn-step-next').onclick = () => { goToFrame(currentFrame + 1); };
    document.getElementById('btn-play').onclick = togglePlay;
    document.getElementById('timeline').oninput = e => { goToFrame(parseInt(e.target.value)); };
    document.getElementById('speed-select').onchange = () => { if (playing) { stopPlay(); startPlay(); } };

    function goToFrame(idx) {
      if (!replay) return;
      currentFrame = Math.max(0, Math.min(replay.frames.length - 1, idx));
      document.getElementById('timeline').value = currentFrame;
      render();
      updateSidebar();
      updateFrameInfo();
    }

    function togglePlay() {
      if (playing) { stopPlay(); } else { startPlay(); }
    }

    function startPlay() {
      playing = true;
      document.getElementById('btn-play').innerHTML = '<svg class="ink-ic fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
      document.getElementById('btn-play').classList.add('active');
      const speed = parseInt(document.getElementById('speed-select').value);
      playInterval = setInterval(() => {
        if (currentFrame >= replay.frames.length - 1) { stopPlay(); return; }
        goToFrame(nextTurnFrame(currentFrame));
      }, speed);
    }

    function stopPlay() {
      playing = false;
      document.getElementById('btn-play').innerHTML = '<svg class="ink-ic fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>';
      document.getElementById('btn-play').classList.remove('active');
      if (playInterval) { clearInterval(playInterval); playInterval = null; }
    }

    function updateFrameInfo() {
      if (!replay) return;
      const frame = replay.frames[currentFrame];
      const turnIdx = turnFrames.indexOf(currentFrame);
      const totalTurns = turnFrames.length;
      let label = turnIdx >= 0 ? `Étape ${turnIdx + 1} / ${totalTurns}` : `Image ${currentFrame + 1} / ${replay.frames.length}`;
      if (frame.turn) label += ` — Tour ${frame.turn}`;
      if (frame.manche) label += ` · Manche ${frame.manche}`;
      if (frame.currentPlayerId && replay.players) {
        const p = replay.players.find(p => p.id === frame.currentPlayerId);
        if (p) label += ` — ${p.name}`;
      }
      if (frame.type === 'deployment') label += ' [déploiement]';
      else if (frame.type === 'battle_start') label += ' [début de la bataille]';
      else if (frame.winner) label += ` [victoire de ${replay.players.find(p => p.id === frame.winner)?.name || '?'}]`;
      document.getElementById('frame-info').textContent = label;
      const ti = document.getElementById('time-info');
      if (frame.timeOfDay != null) {
        const h = Math.floor(frame.timeOfDay), m = Math.round((frame.timeOfDay - h) * 60);
        ti.innerHTML = `${frame.isNight ? '<svg class="ink-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/></svg>' : '<svg class="ink-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>'} <strong>${String(h).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}</strong>`;
      } else ti.textContent = '';
    }

    // === RENDERING ===
    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      render();
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 50);

    function render() {
      if (!canvas.width) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.translate(canvas.width / 2 + camX, canvas.height / 2 + camY);
      ctx.scale(zoom, zoom);

      // Draw map (calibrated background, or plain hexes when the map has none)
      if (mapBg && mapImage.complete && mapImage.naturalWidth) {
        const scale = HEX_SIZE / mapBg.hexSize;
        ctx.drawImage(mapImage, -mapBg.origX * scale, -mapBg.origY * scale, mapBg.width * scale, mapBg.height * scale);
      } else if (!mapBg) {
        for (const k of mapHexKeys) {
          const [q, r] = k.split(',').map(Number);
          const { x, y } = hexToPixel(q, r);
          drawHex(ctx, x, y, '#3d4a2a', 'transparent', 1);
        }
      }

      // Draw hex grid
      drawHexGrid();

      // Draw segments
      drawSegments();

      const frame = replay && replay.frames[currentFrame];
      drawObjectives(frame ? frame.owners || {} : {});

      // Draw units
      if (frame) {
        drawUnits(frame.units);
        const a = frame.action;
        if (a && a.type === 'move' && a.path && a.path.length > 1) drawPath(a.path);
      }

      ctx.restore();
      if (frame && frame.isNight) {
        ctx.fillStyle = 'rgba(10,15,45,0.35)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function drawHexGrid() {
      const viewLeft = (-canvas.width / 2 - camX) / zoom;
      const viewRight = (canvas.width / 2 - camX) / zoom;
      const viewTop = (-canvas.height / 2 - camY) / zoom;
      const viewBottom = (canvas.height / 2 - camY) / zoom;

      for (const [key, type] of Object.entries(terrainData)) {
        const [q, r] = key.split(',').map(Number);
        const { x, y } = hexToPixel(q, r);
        if (x < viewLeft - 40 || x > viewRight + 40 || y < viewTop - 40 || y > viewBottom + 40) continue;

        // Terrain overlay
        const color = TERRAIN_COLORS[type];
        if (color) {
          drawHex(ctx, x, y, color, 'transparent', 1);
        }

        // Grid line
        drawHex(ctx, x, y, 'transparent', `rgba(180,140,60,0.15)`, 1, 0.5);
      }
    }

    function drawSegments() {
      ctx.save();
      ctx.lineCap = 'round';
      for (const [edgeKey, segType] of Object.entries(segmentData)) {
        const color = SEGMENT_COLORS[segType];
        if (!color) continue;
        const parts = edgeKey.split('|');
        const [q1, r1] = parts[0].split(',').map(Number);
        const [q2, r2] = parts[1].split(',').map(Number);
        const dq = q2 - q1, dr = r2 - r1;
        const dirIdx = SEGMENT_EDGE_DIRS.findIndex(([d0, d1]) => d0 === dq && d1 === dr);
        if (dirIdx === -1) continue;
        const { x: cx, y: cy } = hexToPixel(q1, r1);
        const corners = hexCorners(cx, cy);
        const c1 = corners[dirIdx], c2 = corners[(dirIdx + 1) % 6];
        ctx.strokeStyle = color;
        ctx.lineWidth = HEX_SIZE * 0.13;
        ctx.beginPath();
        ctx.moveTo(c1.x, c1.y);
        ctx.lineTo(c2.x, c2.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawObjectives(owners) {
      for (const o of mapObjectives) {
        const { x, y } = hexToPixel(o.q, o.r);
        const owner = owners[o.id];
        const color = owner ? (PLAYER_COLORS[owner] || '#ffd700') : '#d8c9a0';
        drawHex(ctx, x, y, 'transparent', color, 1, 3);
        ctx.save();
        ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x - 8, y + 10); ctx.lineTo(x - 8, y - 14); ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.moveTo(x - 8, y - 14); ctx.lineTo(x + 8, y - 9); ctx.lineTo(x - 8, y - 4); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    function drawPath(path) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,215,0,0.8)';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      path.forEach(([q, r], i) => { const { x, y } = hexToPixel(q, r); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
      ctx.restore();
    }

    function drawUnits(units) {
      if (!units) return;
      for (const u of units) {
        if (u.q === null) continue;
        const { x, y } = hexToPixel(u.q, u.r);
        const color = PLAYER_COLORS[u.playerId] || '#888';
        const radius = u.isGeneral ? HEX_SIZE * 0.55 : HEX_SIZE * 0.45;

        ctx.save();
        ctx.translate(x, y);

        // Rotation for facing
        const angle = FACING_ANGLES[u.facing ?? 5] || 0;
        ctx.rotate(angle);

        // Body
        if (u.isGeneral) {
          drawStar(ctx, 0, 0, radius, 5);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.4)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // Facing indicator (triangle)
        ctx.beginPath();
        ctx.moveTo(radius + 3, 0);
        ctx.lineTo(radius - 4, -5);
        ctx.lineTo(radius - 4, 5);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fill();

        ctx.restore();

        // Label (unit initial) — not rotated
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.round(radius * 0.9)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const initial = u.isGeneral ? '★' : (u.name ? u.name[0] : '?');
        ctx.fillText(initial, 0, 1);
        ctx.restore();

        // HP bar
        const barWidth = radius * 2.2;
        const barHeight = 3;
        const barY = y + radius + 5;
        const hpRatio = Math.max(0, Math.min(1, u.vitality / (u.maxVitality || 1)));
        const hpColor = hpRatio > 0.5 ? '#4a4' : hpRatio > 0.25 ? '#aa4' : '#a44';
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(x - barWidth / 2, barY, barWidth, barHeight);
        ctx.fillStyle = hpColor;
        ctx.fillRect(x - barWidth / 2, barY, barWidth * hpRatio, barHeight);

        // Fleeing indicator
        if (u.isFleeing) {
          ctx.fillStyle = 'rgba(255,120,0,0.4)';
          ctx.beginPath();
          ctx.arc(x, y, radius + 2, 0, Math.PI * 2);
          ctx.fill();
        }

        // Stance label
        if (u.stance && !u.isGeneral) {
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.font = `bold 7px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(u.stance.substring(0, 3).toUpperCase(), x, y + radius + 14);
        }
      }
    }

    function drawStar(ctx, cx, cy, r, points) {
      ctx.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const angle = (i * Math.PI / points) - Math.PI / 2;
        const dist = i % 2 === 0 ? r : r * 0.45;
        const px = cx + Math.cos(angle) * dist;
        const py = cy + Math.sin(angle) * dist;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    // === SIDEBAR ===
    const playerName = (id) => escapeHtml((replay?.players || []).find(p => p.id === id)?.name || '?');

    function formatAction(a) {
      const n = (s) => escapeHtml(s);
      if (a.type === 'move') return `${n(a.unitName)} se déplace en (${a.toQ},${a.toR})${a.ambush ? ` — <b style="color:#f84">embuscade de ${n(a.ambush)} !</b>` : ''}`;
      if (a.type === 'attack') {
        const log = a.combatLog || {};
        const hit = log.hit ? 'TOUCHÉ' : 'RATÉ';
        const dmg = log.dmgReceived || 0;
        let desc = `${n(a.unitName)} &rarr; ${n(a.targetName)} [${hit}${dmg ? ', -' + dmg + ' PV' : ''}]`;
        if (log.counterDmgReceived) desc += ` riposte -${log.counterDmgReceived} PV`;
        if (log.targetKilled) desc += ' — éliminé !';
        if (log.attackerKilled) desc += ` — ${n(a.unitName)} éliminé !`;
        return desc;
      }
      if (a.type === 'duel') {
        const d = a.combatLog.duel;
        const rounds = d.rounds.map(rd => rd.attacker ? `${rd.attacker === d.attackerId ? n(a.unitName) : n(a.targetName)} -${rd.dmg}` : 'parade').join(', ');
        const w = d.winnerId === d.attackerId ? a.unitName : d.winnerId === d.defenderId ? a.targetName : null;
        return `Duel ${n(a.unitName)} contre ${n(a.targetName)} : ${rounds} — ${w ? `<b>${n(w)}</b> l'emporte` : 'égalité'}${a.combatLog.generalKilled ? ' (général tué)' : ''}`;
      }
      if (a.type === 'stance') return `${n(a.unitName)} : posture ${n(STANCE_NAMES[a.to] || a.to)}`;
      if (a.type === 'facing') return `${n(a.unitName)} pivote`;
      if (a.type === 'motivate') return `${n(a.unitName)} motive ses troupes (${a.success ? `réussi, ${a.count} unité(s)` : 'échec'})`;
      if (a.type === 'ability') return `${n(a.unitName)} : ${n(a.name)} — ${(a.effects || []).map(n).join(', ')}`;
      if (a.type === 'fled') return `En fuite hors de la carte : ${a.names.map(n).join(', ')}`;
      if (a.type === 'capture') return `${playerName(a.owner)} prend l'objectif ${n(a.name)}`;
      if (a.type === 'score') return `Scores : ${Object.entries(a.scores).map(([id, s]) => `${playerName(id)} ${s}`).join(' · ')}`;
      if (a.type === 'end') return a.winnerId ? `Victoire de ${playerName(a.winnerId)} (${END_REASONS[a.reason] || a.reason})` : `Match nul (${END_REASONS[a.reason] || a.reason || ''})`;
      return n(a.type);
    }
    const ACTION_LABELS = { move: 'mouvement', attack: 'attaque', duel: 'duel', stance: 'posture', facing: 'pivot', motivate: 'motivation', ability: 'capacité', fled: 'fuite', capture: 'objectif', score: 'points', end: 'fin' };

    function collectTurnActions(frameIdx) {
      const actions = [];
      // Scan backwards from frameIdx to find all actions in this turn
      for (let i = frameIdx; i >= 0; i--) {
        const f = replay.frames[i];
        if (f.type === 'action' && f.action) {
          actions.unshift(f.action);
        } else if (i < frameIdx && (f.type === 'end_turn' || f.type === 'battle_start' || f.type === 'deployment')) {
          break;
        }
      }
      return actions;
    }

    function updateSidebar() {
      if (!replay) return;
      const frame = replay.frames[currentFrame];
      if (!frame || !frame.units) return;

      const actionDiv = document.getElementById('action-list');

      if (frame.type === 'deployment') {
        actionDiv.innerHTML = '<div class="action-log"><span class="action-type">[déploiement]</span> Positions initiales</div>';
      } else if (frame.type === 'battle_start') {
        actionDiv.innerHTML = `<div class="action-log"><span class="action-type">[bataille]</span> La bataille commence !${frame.turnOrder ? ` Ordre : ${frame.turnOrder.map(playerName).join(', ')}` : ''}</div>`;
      } else {
        const actions = collectTurnActions(currentFrame);
        if (actions.length > 0) {
          actionDiv.innerHTML = actions.map(a =>
            `<div class="action-log"><span class="action-type">[${ACTION_LABELS[a.type] || escapeHtml(a.type)}]</span> ${formatAction(a)}</div>`
          ).join('');
        } else {
          const who = frame.currentPlayerId ? playerName(frame.currentPlayerId) : '?';
          actionDiv.innerHTML = `<div class="action-log"><span class="action-type">[manche]</span> Manche de ${who} (aucune action)</div>`;
        }
      }

      const sp = document.getElementById('scores-panel');
      const scores = frame.scores || {};
      if (mapObjectives.length || Object.keys(scores).length) {
        sp.innerHTML = '<h3>Objectifs</h3>' + mapObjectives.map(o => {
          const owner = (frame.owners || {})[o.id];
          return `<div class="action-log"><svg class="ink-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"/></svg> ${escapeHtml(o.name || o.id)} (${o.points ?? 1} pt) — ${owner ? `<span style="color:${escapeHtml(PLAYER_COLORS[owner])}">${playerName(owner)}</span>` : 'neutre'}</div>`;
        }).join('') + (Object.keys(scores).length ? `<div class="action-log">Scores : ${Object.entries(scores).map(([id, s]) => `${playerName(id)} ${s}`).join(' · ')}</div>` : '');
      } else sp.innerHTML = '';

      // Unit cards, one list per player
      const players = replay.players && replay.players.length ? replay.players : [{ id: 'p1', name: 'Joueur 1' }, { id: 'p2', name: 'Joueur 2' }];
      document.getElementById('players-units').innerHTML = players.map(p => {
        const units = frame.units.filter(u => u.playerId === p.id);
        return `<h3 style="color:${escapeHtml(PLAYER_COLORS[p.id] || '#ffd700')}">${escapeHtml(p.name)}</h3>` + units.map(u => {
          const dead = u.vitality <= 0 || u.q === null;
          const hpPct = Math.round((u.vitality / (u.maxVitality || 1)) * 100);
          const morale = u.morale != null ? ` M:${u.morale}` : '';
          return `<div class="unit-card${dead ? ' dead' : ''}${u.isGeneral ? ' general' : ''}">
            <div class="dot" style="background:${escapeHtml(PLAYER_COLORS[p.id] || '#888')}"></div>
            <span class="name">${escapeHtml(u.name)}</span>
            <span class="hp">${u.vitality}/${u.maxVitality} (${hpPct}%)${morale}</span>
          </div>`;
        }).join('');
      }).join('');
    }

    // === PAN & ZOOM ===
    canvas.addEventListener('mousedown', e => {
      isDragging = true;
      dragStartX = e.clientX; dragStartY = e.clientY;
      camAtDragX = camX; camAtDragY = camY;
    });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      camX = camAtDragX + (e.clientX - dragStartX);
      camY = camAtDragY + (e.clientY - dragStartY);
      render();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      zoom *= factor;
      zoom = Math.max(0.1, Math.min(3, zoom));
      render();
    }, { passive: false });

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'l') goToFrame(nextTurnFrame(currentFrame));
      else if (e.key === 'ArrowLeft' || e.key === 'h') goToFrame(prevTurnFrame(currentFrame));
      else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
      else if (e.key === 'Home') goToFrame(0);
      else if (e.key === 'End') goToFrame(replay ? replay.frames.length - 1 : 0);
    });

    updateFrameInfo();
  </script>
</body>
</html>
