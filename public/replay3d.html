<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingdom Battleground — Replay 3D</title>
<link rel="stylesheet" href="/css/ink-d.css">
<link rel="stylesheet" href="/css/hud.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: var(--ink-bg); font-family: var(--ink-body); color: var(--ink-text); }
  #stage { position: fixed; inset: 0; }
  #c3d { display: block; width: 100%; height: 100%; outline: none; }
  #controls { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 50; width: min(1100px, calc(100vw - 28px));
    display: flex; flex-direction: column; gap: 4px; background: var(--ink-panel); border-top: 1px solid var(--ink-line); box-shadow: 0 14px 36px rgba(0,0,0,.5); padding: 10px 16px 8px; }
  #controls .rc-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #controls .rc-info { flex: 1; min-width: 220px; font-size: 12px; color: var(--ink-soft); display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  #controls .rc-info .n { font: 400 17px var(--ink-display); color: var(--ink-text); }
  #controls .rc-info .c { margin-left: auto; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  #controls .rc-lab { font: 700 11px var(--ink-body); letter-spacing: 1px; text-transform: uppercase; color: var(--ink-muted); display: inline-flex; align-items: center; gap: 6px; }
  #title { position: fixed; top: 14px; left: 14px; z-index: 50; display: flex; align-items: center; gap: 12px; background: #0E0D0C; padding: 8px 14px 8px 8px; box-shadow: 0 2px 0 var(--ink-red); }
  #title .seal { width: 30px; height: 30px; border-radius: 50%; background: var(--ink-red); color: var(--ink-bg); font: 18px var(--ink-brush); display: inline-flex; align-items: center; justify-content: center; }
  #title b { font: 400 16px var(--ink-display); letter-spacing: 3px; }
  #title a { color: var(--ink-muted); font-size: 12px; font-weight: 700; text-decoration: none; border: 1px solid var(--ink-line-strong); border-radius: 999px; padding: 4px 10px; }
  #title a:hover { color: var(--ink-red-text); border-color: var(--ink-red); }
  #drop { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 40%, #1d1b18 0%, #0a0a0c 70%); text-align: center; padding: 20px; }
  #drop.hidden { display: none; }
  #drop .seal { width: 72px; height: 72px; border-radius: 50%; background: var(--ink-red); color: var(--ink-bg); font: 42px var(--ink-brush); display: flex; align-items: center; justify-content: center; }
  #drop h2 { font: 400 26px var(--ink-display); letter-spacing: 3px; }
  #drop .box { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #drop #msg { font-size: 13px; color: var(--ink-muted); }
  #drop .pick { background: var(--ink-red); color: #fff; padding: 12px 28px; border-radius: 999px; cursor: pointer; font: 700 14px var(--ink-body); }
  #drop .pick:hover { background: var(--ink-red-hi); }
  #drop .pick input { display: none; }
  #drop .bar { width: 280px; height: 3px; background: rgba(239,232,216,.15); }
  #drop .bar i { display: block; height: 100%; width: 0; background: var(--ink-red); }
  body.v3-photo #controls, body.v3-photo #title { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"><canvas id="c3d" tabindex="0"></canvas></div>
<div id="title"><span class="seal">録</span><b>REPLAY 3D</b><a id="link-2d" href="/replay.html?local=1">Vue 2D</a><a href="/">Menu</a></div>
<div id="controls"></div>
<div id="drop">
  <div class="box">
    <div class="seal">録</div>
    <h2>REPLAY 3D</h2>
    <div id="msg">Déposez un fichier de replay (.json) ou choisissez-le</div>
    <label class="pick">Choisir un fichier <input type="file" accept=".json,application/json"></label>
  </div>
  <div class="bar"><i></i></div>
</div>
<script type="module">
import { mountReplay3d } from './js/map3d/replay3d.js';

const drop = document.getElementById('drop');
const msg = document.getElementById('msg');
const bar = drop.querySelector('.bar i');
let started = false;

async function start(rep) {
  if (started) return;
  if (!rep || rep.format !== 'kb-replay-1') { msg.textContent = 'Format non reconnu (kb-replay-1 attendu).'; return; }
  started = true;
  msg.textContent = 'Chargement de la carte…';
  window.__replay = await mountReplay3d(rep, {
    container: document.getElementById('stage'),
    canvas: document.getElementById('c3d'),
    controlsEl: document.getElementById('controls'),
    onProgress: (p) => { bar.style.width = p + '%'; },
  });
  drop.classList.add('hidden');
}

const params = new URLSearchParams(location.search);
if (params.has('local')) {
  try { const raw = localStorage.getItem('kb_last_replay'); if (raw) start(JSON.parse(raw)); else msg.textContent = 'Aucun replay enregistré dans ce navigateur.'; }
  catch (e) { msg.textContent = 'Replay illisible.'; }
} else if (params.get('file')) {
  document.getElementById('link-2d').href = '/replay.html?file=' + encodeURIComponent(params.get('file'));
  fetch(params.get('file')).then((r) => r.json()).then(start).catch(() => { msg.textContent = 'Impossible de charger le replay.'; });
}
const readFile = (f) => f && f.text().then((t) => start(JSON.parse(t))).catch(() => { msg.textContent = 'Fichier invalide.'; });
drop.querySelector('input').addEventListener('change', (e) => readFile(e.target.files[0]));
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => { e.preventDefault(); readFile(e.dataTransfer.files[0]); });
</script>
</body>
</html>
